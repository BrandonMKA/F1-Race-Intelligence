name: Update Formula 1 Race Data

on:
  schedule:
    # Runs every day at 12:17 UTC. Existing races are skipped.
    - cron: "0 1 * * 1"   

  workflow_dispatch:
    inputs:
      season:
        description: "Optional season to check; blank uses current year"
        required: false
        type: string

concurrency:
  group: f1-race-ingestion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Restore FastF1 cache
        uses: actions/cache@v4
        with:
          path: cache
          key: fastf1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fastf1-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update requested season
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.season != '' }}
        run: python -m scripts.update_current_season --season "${{ inputs.season }}"

      - name: Update current season
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.season == '' }}
        run: python -m scripts.update_current_season