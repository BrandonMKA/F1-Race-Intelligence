services:
  - type: web
    name: f1-race-intelligence-api
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: >
      uvicorn api.main:app
      --host 0.0.0.0
      --port $PORT

    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: ALLOWED_ORIGINS
        sync: false

      - key: PYTHON_VERSION
        value: 3.13.5